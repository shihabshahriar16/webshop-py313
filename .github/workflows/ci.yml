# Check the claim this fork makes: from a clean checkout, the Python 3.13 setup
# builds everything itself and reproduces the Python 3.8 reference exactly.
# (Replaces upstream's py3.8 pytest workflow, whose dependency install breaks.)
name: Py3.13 equivalence
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_py313.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the Anserini jar (115 MB, checksum-verified by the setup)
        uses: actions/cache@v4
        with:
          path: search_engine/jars
          key: anserini-0.14.3-e7bb590eae31

      - name: Setup (packages, jar, data, corpus, indexes)
        run: ./setup_py313.sh

      - name: Upstream unit tests (engine)
        run: |
          python -m pip install pytest
          python -m pytest -q tests/web-agent-site

      - name: Equivalence with the Python 3.8 reference
        run: >
          python equivalence/harness.py replay
          --golden equivalence/golden/golden_py38.json.gz
          --report equivalence-report.json

      - name: Upload the equivalence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-report
          path: equivalence-report.json
          if-no-files-found: ignore
